# Check the fleet inventory and the rollouts against the contract of the pinned tools (.cicd), on
# every pull request and on main. Read-only token, no secrets.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    name: fleet.toml (schema 2) and rollouts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check fleet.toml against .cicd/fleet/lib/check-inventory.py
        run: python3 .cicd/fleet/lib/check-inventory.py fleet.toml
      - name: Check every rollout against .cicd/fleet/lib/check-rollout.py
        run: for r in rollouts/*/*/; do python3 .cicd/fleet/lib/check-rollout.py "$r" || exit 1; done
