name        = "0002-fleet-submodule"
cohort      = "way-a"
description = """
Make rollouts migrations in every member: the fleet's definition repository pinned as the .fleet
submodule, the record of applied rollouts in .waves/, and a CI check that fails when the repository
lacks a rollout its pinned definition holds. Brings both tooling repositories, wamp-cicd and
wamp-ai, to their heads as of this rollout: the same pair in every member.
"""

# What "applied" means for this rollout (check.sh): wamp-cicd and wamp-ai are pinned at these
# commits or later ones, the community files still match wamp-cicd's templates, and every workflow
# that runs the community files check runs the lag check too.
# The definition's pin (.fleet, or deps.toml in a tooling source) and the .waves/ markers are
# written by the runner, not by apply.sh.
[pins]
cicd = "1378b0ba2d22b6f5d688f6e11294d183c1c047bc"
ai   = "149df209fffc258b270aad303cf21e69ab4b7b97"
