description = """
Make rollouts migrations in every member: the fleet's definition repository pinned as the .fleet
submodule, the record of applied rollouts in .waves/, and a CI check that fails when the repository
lacks a rollout its pinned definition holds. Brings .cicd to the tools version that has the check.
"""

# What "applied" means for this rollout (check.sh): wamp-cicd is pinned at this commit or a later
# one (the lag check that finds the pinned definition in every layout), the community files
# still match its templates, and every workflow that runs the community files check runs the lag
# check too.
# The definition's pin (.fleet, or deps.toml in a tooling source) and the .waves/ markers are
# written by the runner, not by apply.sh.
