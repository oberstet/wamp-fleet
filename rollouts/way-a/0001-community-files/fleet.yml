# Fleet checks: what every member of the `way-a` cohort verifies in CI. Added by the rollout
# way-a/0001-community-files for a repository that had no workflow to put them in; later rollouts
# add their checks here. Read-only token, no secrets.

name: fleet

on:
  pull_request:
  push:
    branches: [@@MAIN@@]

permissions:
  contents: read

jobs:
  fleet:
    name: Fleet checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive #@only:ordinary
          persist-credentials: false

      # This repository carries no submodules (TOOLING-STRUCTURE.md): what it depends on is #@only:cicd,ai
      # checked out into .deps/ at the commits deps.toml pins. #@only:cicd,ai
      - name: Dependencies at their pinned commits (deps.toml) #@only:cicd,ai
        run: bash scripts/deps.sh sync #@only:cicd,ai
 #@only:cicd,ai
      # scripts/deps.sh and TOOLING-STRUCTURE.md are copies of wamp-cicd's, kept identical. #@only:ai
      - name: Managed copies in sync with .deps/wamp-cicd #@only:ai
        run: cmp scripts/deps.sh .deps/wamp-cicd/scripts/deps.sh && cmp TOOLING-STRUCTURE.md .deps/wamp-cicd/TOOLING-STRUCTURE.md #@only:ai
 #@only:ai
      # Shared community files (CONTRIBUTING.md, PR template, .audit/README.md) must be
      # byte-identical to wamp-cicd's templates at the pinned commit (wamp-cicd#16).
      - name: Community files in sync with wamp-cicd's templates
        run: bash @@P@@scripts/community-files.sh check .
