# way-a/0001-community-files. First applied by hand (the [applied] record below); check.sh and
# apply.sh came later, so that the runner in wamp-proto/wamp-cicd can adopt it where it is in
# place and apply it where it is not.

name        = "0001-community-files"
cohort      = "way-a"
description = """
Pin the shared tooling (.cicd, .ai) to one commit pair, deploy the shared contribution files
(CONTRIBUTING.md, the pull request template, .audit/README.md), seed a per-repository
DEVELOPMENT.md, add the CI drift check, and adopt the Way-A workflow (import .cicd/workflow.just).
"""

# What "applied" means for this rollout (check.sh): the tooling is pinned at these commits or
# later ones, the community files match wamp-cicd's templates, the justfile imports
# workflow.just, and a CI workflow runs the community files check.
[pins]
cicd = "38ded6a15062348f180cf31a09370c3e63cbf5d0"
ai   = "64f2e5da554005b93855d0daf70b8a61b187d26b"

# The two tooling sources (wamp-proto/wamp-cicd, wamp-proto/wamp-ai) take this rollout WITHOUT
# submodules: every other repository pins them, so a submodule inside them would be cloned by
# every recursive checkout of every repository. Their pins are in deps.toml, their checkouts in
# the gitignored .deps/ (wamp-cicd: TOOLING-STRUCTURE.md). wamp-cicd pins wamp-ai there, wamp-ai
# pins wamp-cicd - at the first commit that has what a tooling source needs (scripts/deps.sh,
# the lag check that finds the definition under .deps/).
[pins.tooling]
cicd = "8465a483881d54842f1702b469302687d957c67d"

# The members it was applied to by hand, as rollout `wave1-2026-09`, before it had an apply.sh.
# issue.md is the text each repository's rollout issue was rendered from.
[applied]
by     = "hand (rollout wave1-2026-09)"
landed = 2026-09-29

[[landed]]
repo   = "wamp-proto"
issue  = 574
pr     = 575
commit = "5003b72"
